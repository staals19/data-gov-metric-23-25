cionciudadana.gub.uy/processes/consulta-publica-estrategia-nacional-inteligencia-artificial","FALSE"],["Uruguay","6d","IND_07","Binding Trade Agreements on Cross-Border Data Flows","1","1","No Change","https://www.mercosur.int/documento/acuerdo-sobre-comercio-electronico-del-mercosur/","https://www.mercosur.int/documento/acuerdo-sobre-comercio-electronico-del-mercosur","FALSE"],["Uruguay","1a / 1b","IND_10","National and Public Administration Data Strategy","0","1","Adopted","https://www.gub.uy/agencia-gobierno-electronico-sociedad-informacion-conocimiento/comunicacion/publicaciones/politica-datos-para-transformacion-digital/politica-datos-para","https://oecd.ai/en/dashboards/policy-initiatives/data-policy-and-strategy-for-digital-transformation-4822","FALSE"],["Uruguay","2e","IND_12","Data Portability Right","0","1","Adopted","","https://www.gub.uy/unidad-reguladora-control-datos-personales/","FALSE"],["Uruguay","4b","IND_15","Open Data Portal","1","1","No Change","https://catalogodatos.gub.uy/","https://catalogodatos.gub.uy/","FALSE"],["Vietnam","2a","IND_01","Personal Data Protection Law","0","1","Adopted","https://thuvienphapluat.vn/van-ban/Cong-nghe-thong-tin/Nghi-dinh-13-2023-ND-CP-bao-ve-du-lieu-ca-nhan-465185.aspx","https://resources.finalsite.net/images/v1710749328/saigon/l5cqb4izgsc1uwugo98e/Decree13_2023_ND-CPPersonalDataProtectionENGLISH.pdf","FALSE"],["Vietnam","2b","IND_02","Open Data Law (Proactive Release)","0","0","No Change","","","FALSE"],["Vietnam","4a","IND_04","Personal Data Protection Body","0","0","No Change","","","FALSE"],["Vietnam","5a","IND_05","Public Consultation on Data","1","1","No Change","http://bocongan.gov.vn/vanban/Pages/van-ban-moi.aspx?ItemID=519","https://vanban.chinhphu.vn/default.aspx?pageid=27160&docid=210753","FALSE"],["Vietnam","6d","IND_07","Binding Trade Agreements on Cross-Border Data Flows","1","1","No Change","http://rtais.wto.org/UI/PublicSearchByCrResult.aspx","https://www.mfat.govt.nz/en/trade/free-trade-agreements/free-trade-agreements-in-force/cptpp/comprehensive-and-progressive-agreement-for-trans-pacific-partnership-text-and-resources","FALSE"],["Vietnam","1a / 1b","IND_10","National and Public Administration Data Strategy","0","1","Adopted","","https://english.mic.gov.vn/vietnams-national-data-strategy-towards-2030-approved-197240216084650104.htm","FALSE"],["Vietnam","2e","IND_12","Data Portability Right","0","1","Adopted","","https://resources.finalsite.net/images/v1710749328/saigon/l5cqb4izgsc1uwugo98e/Decree13_2023_ND-CPPersonalDataProtectionENGLISH.pdf","FALSE"],["Vietnam","4b","IND_15","Open Data Portal","1","1","No Change","https://data.gov.vn/","https://data.gov.vn","FALSE"]]},{"name":"Indicators","head":["2023 Indicator","2025 Indicator","Indicator Name","Definition"],"rows":[["2a","IND_01","Personal Data Protection Law","Personal data laws are laws that delineate how private and often public entities are required to treat digital personal data. If there is one ‘comprehensive’ law for the public sector and another for the private, both are counted together affirmatively; on the other hand, if a country has a law governing personal data held by the private sector but does not govern that held by the public sector, it would not count."],["2b","IND_02","Open Data Law (Proactive Release)","Open data laws require governmental bodies to make public sector data freely available, easy to use, distribute and reuse, subject to limited exceptions such as for national security or to protect privacy. Open data laws generally require the government to proactively and transparently release information. If a law dictates a regime wherein citizens have unrestricted access to government datasets, it would thus not count unless there is a mandate for the government to actively publish data, subject to certain exceptions."],["4a","IND_04","Personal Data Protection Body","An institutional structure accountable for the governance and protection of personal data in society.  This body must be independent and have enforcement authority. This structure is typically established by the country’s personal data law."],["5a","IND_05","Public Consultation on Data","Government has formally asked for public comment verbally and/or in writing."],["6d","IND_07","Binding Trade Agreements on Cross-Border Data Flows","At least one active trade agreement includes binding rules about allowing cross-border data flows."],["1a / 1b","IND_10","National and Public Administration Data Strategy","A national data strategy is a national plan or vision that aims to increase the provision, use, and re-use of various types of data in adherence to national norms and laws. It covers data as a commercial asset, as well as a public good. According to the OECD, governments use these national strategies to focus attention and resources at a national level, describe how societal entities can work together to benefit from data, and to put forward a vision on how to manage change as well as risks that may arise for individuals and the nation as a whole when national entities use data to innovate or to solve societal questions.  covers commercial and public good uses of data. Not a personal data strategy. \n\nA public administration data strategy delineates how the government will only refers to data held governmental entities . It is not the same as an open data strategy.Some public administration data strategies may be expressed in laws or policies (such as the Data Strategy of the German Federal Government 2021), but is often a separate document; sometimes multiple separate documents can be taken as together forming the strategy. Some public data strategies may be expressed as a policy, framework, or law."],["2e","IND_12","Data Portability Right","Binding rules give individuals a right to receive and transfer their personal data in a usable, machine-readable format."],["4b","IND_15","Open Data Portal","An open data portal is an online platform which supports users in accessing collections of data that have been opened for public re-use. Government open data portals may be in response to requirements of freedom of information laws or open data laws."]]},{"name":"2025 Adoption","head":["AI Indicators","Indicator Name","# of Countries (2025)"],"rows":[["IND_05","Public Consultations on Data or AI Governnace","64"],["IND_17","Text and Data Mining Exceptions to Encourage AI in Intellectual Property","1"],["IND_18","Law Requiring Data Provenance for AI","16"],["IND_19","Publicly Funded Foundation Model Using Public Data Assets","6"],["IND_20","Binding AI Procurement Requirements (Public Sector)","6"],["IND_21","Requirements for Impact Assessments for High Risk AI Systems (that discusses data)","39"],["IND_22","Updated Data Strategy for AI (since 2023)","42"],["IND_23","AI Literacy Programs","55"]]}];
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const link=s=>esc(s).replace(/https?:\/\/[^\s"'<\]]+/g,u=>'<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>');
let cur=0;
const tabs=document.getElementById("tabs"),q=document.getElementById("q");
SHEETS.forEach((s,i)=>{const b=document.createElement("button");b.textContent=s.name;b.onclick=()=>{cur=i;q.value="";draw()};tabs.appendChild(b)});
function draw(){
  const s=SHEETS[cur],f=q.value.trim().toLowerCase();
  [...tabs.children].forEach((b,i)=>b.setAttribute("aria-selected",i===cur));
  const rows=f?s.rows.filter(r=>r.join(" ").toLowerCase().includes(f)):s.rows;
  document.getElementById("count").textContent=rows.length+" of "+s.rows.length+" rows";
  document.getElementById("t").innerHTML="<thead><tr>"+s.head.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"+
    rows.map(r=>"<tr>"+r.map(v=>"<td"+(v.length>120?' class="long"':"")+">"+link(v)+"</td>").join("")+"</tr>").join("")+"</tbody>";
}
q.addEventListener("input",draw);
draw();
</script>
